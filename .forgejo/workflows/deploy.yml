name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-spark
  cancel-in-progress: false

jobs:
  switch-spark:
    name: Switch Spark
    runs-on: spark
    timeout-minutes: 45
    steps:
      - name: nixos-rebuild switch
        run: /run/wrappers/bin/sudo /run/current-system/sw/bin/spark-deploy
