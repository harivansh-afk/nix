name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-spark
  cancel-in-progress: false

jobs:
  switch-spark:
    name: Switch Spark
    runs-on: spark
    # A hung flake-input fetch once pinned this job (and the deploy-spark
    # concurrency group) for hours; cap it well below the runner's 3h timeout.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # spark-deploy runs nixos-rebuild as its own root unit, so a switch that
      # replaces or stops this runner cannot kill it.
      - name: nixos-rebuild switch
        run: /run/wrappers/bin/sudo /run/current-system/sw/bin/spark-deploy "$PWD"
