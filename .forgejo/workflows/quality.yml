name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flake-check:
    name: Flake Check
    runs-on: native
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: nix flake check

  nix-format:
    name: Nix Format Check
    runs-on: native
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: nix fmt -- --ci --tree-root "$PWD" --walk git
