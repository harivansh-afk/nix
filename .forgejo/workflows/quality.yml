name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    runs-on: native
    timeout-minutes: 10
    outputs:
      quality: ${{ steps.filter.outputs.quality }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            quality:
              - "**/*.nix"
              - "flake.lock"
              - "flake.nix"
              - "justfile"
              - "dots/**"
              - "scripts/**"
              - "pkgs/**"
              - ".forgejo/workflows/**"

  flake-check:
    name: Flake Check
    runs-on: native
    # 60 rather than 30: every push also fires deploy.yml's Switch Spark on
    # this same single runner host, a 40-minute nixos-rebuild that starves a
    # concurrent flake check into a timeout (e624de183: check dead at 30m02s
    # while the switch it raced succeeded at 41m). The timeout is a hang
    # guard, not a perf budget; a check that loses the CPU race to a deploy
    # is not a broken flake.
    timeout-minutes: 60
    needs: changes
    if: ${{ needs.changes.outputs.quality == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - run: nix flake check

  nix-format:
    name: Nix Format Check
    runs-on: native
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.quality == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - run: nix fmt -- --ci --tree-root "$PWD" --walk git
