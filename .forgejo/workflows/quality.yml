name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flake-check:
    name: Flake Check
    runs-on: native
    # 60 rather than 30: every push also fires deploy.yml's Switch Spark on
    # this same single runner host, a 40-minute nixos-rebuild that starves a
    # concurrent flake check into a timeout (e624de183: check dead at 30m02s
    # while the switch it raced succeeded at 41m). The timeout is a hang
    # guard, not a perf budget; a check that loses the CPU race to a deploy
    # is not a broken flake.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: nix flake check

  nix-format:
    name: Nix Format Check
    runs-on: native
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: nix fmt -- --ci --tree-root "$PWD" --walk git
