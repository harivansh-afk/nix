# AeroSpace config, linked at ~/.config/aerospace/aerospace.toml. Live-edited;
# reload with alt-shift-semicolon r (service mode).
# Started by the nix-darwin launchd agent (services.aerospace in
# hosts/macbook/macos.nix), NOT by AeroSpace's own SMAppService login item:
# with both enabled two instances raced at every login. `false` also makes
# AeroSpace unregister its login item on next start (Sources/.../startAtLogin.swift).
start-at-login = false

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Keep sketchybar's workspace indicators in sync (dots/sketchybar).
# sketchybar-feed re-renders the workspace tabs on SIGUSR2 (it asks aerospace
# for the focused workspace itself, so no variable passing and no shell).
exec-on-workspace-change = ['/usr/bin/pkill', '-USR2', '-x', 'sketchybar-feed']

[[on-window-detected]]
if.app-id = 'com.apple.LocalAuthentication.UIAgent'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.SecurityAgent'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

# Mux's borderless terminal has no fullscreen button, so AeroSpace's dialog
# heuristic floats it unless explicitly tiled.
[[on-window-detected]]
if.app-id = 'sh.harivan.mux'
run = 'layout tiling'

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.right = 0
# sketchybar (height 32) replaces the hidden native menu bar. The notched
# built-in display already reserves that strip, so only external monitors
# need the gap.
outer.top = [{ monitor.'built-in' = 0 }, 32]
outer.bottom = 0

# Numbered workspaces stay on the laptop, regardless of the primary display.
# Desk follows an external display, then falls back to the laptop.
[workspace-to-monitor-force-assignment]
1 = ['built-in', 'main']
2 = ['built-in', 'main']
3 = ['built-in', 'main']
4 = ['built-in', 'main']
5 = ['built-in', 'main']
6 = ['built-in', 'main']
7 = ['built-in', 'main']
8 = ['built-in', 'main']
9 = ['built-in', 'main']
Desk = ['^(?!.*built-in).*$', 'built-in', 'main']

[mode.main.binding]
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-d = 'workspace Desk'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-d = 'move-node-to-workspace --focus-follows-window Desk'

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

ctrl-alt-h = 'join-with left'
ctrl-alt-j = 'join-with down'
ctrl-alt-k = 'join-with up'
ctrl-alt-l = 'join-with right'

alt-f = 'fullscreen'

alt-shift-f = 'layout floating tiling'

alt-shift-b = 'balance-sizes'

alt-backtick = 'workspace-back-and-forth'

alt-period = 'focus-monitor --wrap-around next'
alt-shift-period = 'move-node-to-monitor --wrap-around --focus-follows-window next'
ctrl-alt-cmd-space = 'move-node-to-monitor --wrap-around --focus-follows-window next'

alt-r = 'mode resize'
alt-shift-semicolon = 'mode service'

alt-shift-s = 'exec-and-forget screencapture -i -c'

[mode.resize.binding]
h = 'resize width +50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width -50'
minus = 'resize smart -50'
equal = 'resize smart +50'
enter = 'mode main'
esc = 'mode main'

[mode.service.binding]
r = ['reload-config', 'mode main']
f = ['flatten-workspace-tree', 'mode main']
b = ['balance-sizes', 'mode main']
esc = 'mode main'
backspace = ['close-all-windows-but-current', 'mode main']
