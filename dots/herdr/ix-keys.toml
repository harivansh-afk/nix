# ix-host-only herdr keybindings (appended to the config render for the ix
# VM image, never for macbook/spark): the herdr-ix-space plugin's surface.

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "ix.space.new"
description = "new ix space (workspace = VM)"

[[keys.command]]
key = "prefix+alt+i"
type = "pane"
command = "exec ix-space enter"
description = "another shell into this space's VM"
