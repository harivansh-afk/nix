# leaf (terminal markdown viewer). Live-edited: ~/.config/leaf/config.toml is
# a symlink to this file. The theme is a relative path, resolved against the
# config file's own directory, so it follows the cozybox mode symlink that the
# `theme` script and the activation script flip between the dark and light
# renders.
theme = "themes/current.toml"

# Ctrl+E opens the source at the first visible line and centres it.
editor = 'nvim +{$line} +"normal! zz"'

# Reload on write, keeping the scroll position.
watch = true
